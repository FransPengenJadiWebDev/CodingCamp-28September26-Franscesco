<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>

    <!-- Chart.js via CDN (Requirement 4.2) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- App styles (Requirement 7.2) -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- App logic — defer keeps execution after HTML parse (Requirement 7.3) -->
    <script defer src="js/script.js"></script>
  </head>
  <body>
    <header>
      <h1>Expense &amp; Budget Visualizer</h1>
      <!-- Theme_Toggle: always visible, single click (Requirement 8.1) -->
      <button id="theme-toggle" aria-label="Toggle dark/light mode">🌙</button>
    </header>

    <main>
      <!-- Balance_Display (Requirement 3.1) -->
      <section id="balance-section">
        <h2>Total Expenses</h2>
        <p id="balance-display">$0.00</p>
      </section>

      <!-- Input_Form (Requirement 1.1) -->
      <section id="form-section">
        <form id="transaction-form" novalidate>
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              id="item-name"
              type="text"
              maxlength="100"
              required
              placeholder="e.g. Lunch"
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input
              id="amount"
              type="number"
              min="0.01"
              max="999999999.99"
              step="0.01"
              required
              placeholder="0.00"
            />
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="">Select category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>

          <button type="submit">Add Transaction</button>
        </form>

        <!-- Validation error area (Requirement 1.3, 1.4, 1.6) -->
        <div id="form-errors" role="alert" aria-live="polite"></div>
      </section>

      <!-- Sort_Control + Limit_Input (Requirements 9.1, 10.1) -->
      <section id="controls-section">
        <div class="control-group">
          <label for="sort-select">Sort by:</label>
          <select id="sort-select">
            <option value="none">— None (chronological) —</option>
            <option value="amount-asc">Amount ↑</option>
            <option value="amount-desc">Amount ↓</option>
            <option value="category-asc">Category A–Z</option>
          </select>
        </div>

        <div class="control-group">
          <label for="limit-input">Highlight limit ($):</label>
          <input
            id="limit-input"
            type="number"
            min="0"
            step="0.01"
            placeholder="0.00"
          />
          <!-- Limit validation error area (Requirement 10.4) -->
          <div id="limit-error" role="alert" aria-live="polite"></div>
        </div>
      </section>

      <!-- Transaction_List (Requirement 2.1, 2.5) -->
      <section id="list-section">
        <h2>Transactions</h2>
        <ul id="transaction-list"></ul>
        <!-- Empty state shown when no transactions exist (Requirement 2.5) -->
        <p id="empty-state" hidden>No transactions recorded yet.</p>
      </section>

      <!-- Pie_Chart (Requirement 4.1) -->
      <section id="chart-section">
        <h2>Spending by Category</h2>
        <canvas id="pie-chart"></canvas>
        <!-- Placeholder when no data (Requirement 4.4) -->
        <p id="chart-empty" hidden>No data available.</p>
      </section>
    </main>
  </body>
</html>
